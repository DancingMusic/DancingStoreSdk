name: Registry CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run store-service:check
      - name: Verify every published plugin artifact against SHA-256
        run: npm run verify:artifacts
      - name: Verify generated registry is committed
        run: git diff --exit-code -- dist/registry.json dist/official-catalog.json dist/store-service-publish.json
